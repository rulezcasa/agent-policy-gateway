[project]
name = "agent-policy-gateway"
version = "0.1.0"
description = "Policy gateway and mock MCP tool server for Maplewood Home & Living"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "anyio>=4",
]

[project.scripts]
maplewood-tools = "app.tools.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
